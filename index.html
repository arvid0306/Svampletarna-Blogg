<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">   
    <script src="js/script.js" defer></script>
    <script src="js/index.js" defer></script>
    <script src="js/login.js" defer></script>
    <title>Alla svampar</title>
</head>

<body>
    <header class="hidden">
        <nav>
            <a href="index.html">
                <img class="logo" src="img/svampletarna-logo.png" alt="Svampletarna logotype">
            </a>
            <a href="index.html" aria-current="page">Alla svampar</a>
            <a href="mina-fynd.html">Mina fynd</a>
            <a href="om-svampar.html">Om svampar</a>
            <button id="btn-log-out" type="button">Logga ut</button>
        </nav>

        <div class="hero">
            <h1>Alla svampar</h1>
            <p>
                Utforska alla svampar som föreningen har registrerat.
                Klicka i rutan när du har hittat en svamp så sparas den i dina fynd.
            </p>
        </div>
    </header>
    <main>
        <div class="hidden">
            <section class="svamp-lista">
                <ul>
                    <li id="placeholder">
                        <article>
                            <!-- placeholder svamp-->
                            <img />
                            <h3>Exempelnamn svenska</h3>
                            <p>Exempelnamn latin</p>
                            <details>
                                <summary>Ätlig</summary>
                                <p>Ätbarhet</p>
                            </details>
                            <p>Beskrivning</p>
                            <p class="location">Fyndplats</p>
                            <button type="button" class="btn-find">Markera som hittad</button>
                        </article>
                    </li>
                </ul>
            </section>
        </div>
        <div id="inloggning">                                           <!--Div för inloggningsformuläret samt välkomstmeddelandet-->
            <img src="img/svampletarna-logo.png" alt="Logotyp på Svampletarna">
            <form id="inloggning-form">                                     <!--Formuläret för inloggningen-->
                <label for="user">Namn:</label>                                 <!--Beskrivande text för vad som ska fyllas i nedanför i input-->
                <input type="text" name="user" id="user">                       <!--Input där användaren fyller i namn-->
                <label for="pwd">Lösenord:</label>                              <!--Beskrivande text för vad som ska fyllas i nedanför i input-->
                <input type="password" name="pwd" id="pwd">                     <!--Input där användaren fyller i lösenordet-->
                <p id="info-log-in-form"></p>                                   <!--Tag där js sedan lägger in felmeddelande vid misslyckad inloggning-->
                <input type="submit" value="Logga in" id="btn-log-in">          <!--Knappen för att logga in-->
            </form>
        </div>
    </main>

    <footer>
        <p>Grupp 5 2026</p>
    </footer>

</body>

</html>
